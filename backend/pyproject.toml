[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-codenames-backend"
version = "0.1.0"
description = "Single-server Codenames with FastAPI, WebSockets, and EmbeddingGemma"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "snowballstemmer>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
gemma = ["sentence-transformers[image]>=6.1,<7", "transformers>=5.18,<6", "torch>=2.9,<3"]
api = []
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
gemma-board = "gemma_codenames.demo:main"
codenames = "gemma_codenames.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemma_codenames*"]

[tool.setuptools.package-data]
gemma_codenames = ["data/*.txt", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
