[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-codenames"
version = "0.2.0"
description = "An inspectable Gemma embedding experiment inside a multiplayer Codenames game"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "snowballstemmer>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<17", "scipy>=1.14,<2", "cvxpy>=1.6,<2"]

[project.optional-dependencies]
gemma = ["sentence-transformers[image]>=6.1,<7", "transformers>=5.18,<6", "torch>=2.9,<3"]
geometry = ["cvxpy>=1.6,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
codenames = "gemma_codenames.web:main"
gemma-board = "gemma_codenames.demo:main"

[tool.setuptools.packages.find]
include = ["gemma_codenames*"]

[tool.setuptools.package-data]
gemma_codenames = ["data/*.txt", "data/*.csv", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
